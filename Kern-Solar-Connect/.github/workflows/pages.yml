name: Publish customer website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run project tests
        run: node --test tests/crm.test.cjs tests/campaigns.test.cjs tests/languages.test.cjs
      - name: Check JavaScript syntax
        run: |
          for file in public/*.js staff-demo/*.js; do
            node --check "$file"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy customer site
        id: deployment
        uses: actions/deploy-pages@v4
